# retinopath settings, shared by every notebook (notebooks only set DEV_MODE).
# `full:` (DEV_MODE=False) or `dev:` (DEV_MODE=True) is merged over the top-level keys; keep the same keys in both.
# Settings marked cached need data/cache deleted after a change; docs/04-configuration.md lists what each change needs.

seed: 2026                  # global random seed (subject lists, noise, seeds, training). Cached.

paths:                      # relative to this file
  data: data
  hcp: data/hcp             # raw HCP files (mirrors the S3 layout)
  osf: data/osf             # HCP 7T retinotopy results
  nsd: data/nsd
  cache: data/cache         # crops, fODFs, tractography endpoints
  out: outputs              # models, results, figures, run log
  env_file: .env            # S3ACCESS_KEY / S3SECRET_KEY for hcp-openaccess

# Subjects with retinotopy looked at while the method and its settings were chosen (dev subjects and the 12 subjects
# of the development runs). Left out of every test list (test, 7T, retest) of the full run; never trained on.
development_subjects: ['100610', '105923', '102816', '125525', '128935', '131217', '172130', '175237', '197348',
                       '263436', '389357', '690152', '927359', '971160']

# ---- experiment size -----------------------------------------------------------------
# Subject lists are saved to outputs/subjects.json; delete it after changing any n_*. -1 = every subject that qualifies.
full:
  n_test: -1                # test subjects with measured 7T retinotopy; -1 = all (about 164 without development_subjects)
  n_train: 12               # training subjects: HCP subjects without 7T data (about 900 available)
  n_val: 8                  # validation subjects, same pool as n_train
  n_7t: 40                  # test subjects also scored on their 7T diffusion scan; <= n_test
  n_retest: 20              # HCP retest subjects with retinotopy (about 20 exist)
  n_nsd: 8                  # NSD subjects, 0 to 8
  train_seeds: [0, 1, 2]    # training seeds of `path` and `voxel`; the other variants use the first only
  variants: [path, voxel, onestep, noanat, signal, mlp]   # of path, voxel, onestep, noanat, wmseeds, signal, mlp;
                            # path and voxel are required for H3
  max_train_hours: null     # null = every run trains all steps; a number stops runs early (keep null for results)
  epochs: 60                # training length = epochs * steps_per_epoch; retrain after a change
  steps_per_epoch: 500      # steps between validations (one log row each)
  batch_size: 16            # an integer, or auto (largest of 8-64 under 70% of GPU memory; 2 on CPU/MPS)
  patch: 48                 # cubic training patch (voxels); multiple of 2^(levels-1), >= 40 for the 40-step path
  base_channels: 48         # U-Net width; multiple of 8
  seeds_per_vertex: 10      # tractography seeds per V1-V3 white-surface vertex
  n_null: 100               # distance-matched surrogates per streamline; >= 20
  n_jobs: -2                # CPU workers; negative counts back from all cores (-1 = all, -2 = all but one)
  gpu_jobs: 4               # sessions at once in network inference (notebooks 06, 07); results do not depend on it
  keep_raw: true            # false = delete the raw HCP diffusion folder after cropping
  run_protocols: [REF, P1, P2, P3, D64, D32, D12, V20, V25]   # protocols evaluated; names from `protocols`; REF must stay
  train_protocols: [P1, P2, P3, D32, T7]   # network inputs in training; names from protocols or extra_protocols
dev:
  n_test: 2
  n_train: 1
  n_val: 1
  n_7t: 1
  n_retest: 1
  n_nsd: 1
  train_seeds: [0]
  variants: [path, voxel, onestep, noanat, signal, mlp]
  subjects: {test: ['100610', '105923'], train: ['100206'], val: ['100307'], t7: ['105923'], retest: ['105923'], nsd: ['subj01']}
  max_train_hours: null
  epochs: 2
  steps_per_epoch: 20
  batch_size: 2
  patch: 24
  base_channels: 8
  seeds_per_vertex: 1
  n_null: 20
  n_jobs: 4
  gpu_jobs: 2
  keep_raw: true
  hemis: [L]                # DEV crops the left hemisphere only
  run_protocols: [REF, P1, P2]   # DEV runs a subset of protocols
  train_protocols: [P1, P2]

hemis: [L, R]               # [L, R] or one of them. Cached.

# ---- acquisition protocols simulated from the HCP 3T data (cached) --------------------
# shells: {b-value: number of directions}; max 90 per shell in HCP 3T, "all" keeps every direction.
# voxel: isotropic voxel size in mm, >= 1.25 (the native size). snr: optional Rician noise at this b=0 white-matter SNR.
protocols:
  REF: {shells: {1000: all, 2000: all, 3000: all}, voxel: 1.25}
  P1:  {shells: {3000: 64}, voxel: 1.5}                 # matches the NSD b=3000 shell
  P2:  {shells: {1000: 32}, voxel: 2.0}
  P3:  {shells: {1000: 20}, voxel: 2.5, snr: 15}
  D64: {shells: {1000: 64}, voxel: 1.25}                # one-factor sweeps
  D32: {shells: {1000: 32}, voxel: 1.25}
  D12: {shells: {1000: 12}, voxel: 1.25}
  V20: {shells: {1000: all, 2000: all, 3000: all}, voxel: 2.0}
  V25: {shells: {1000: all, 2000: all, 3000: all}, voxel: 2.5}
clinical_protocols: [P1, P2, P3]     # confirmatory tests; learned methods run only here. Must be a subset of run_protocols.
extra_protocols:                     # protocols used only for training (merged into `protocols` at load)
  T7: {shells: {1000: 64, 2000: 64}, voxel: 1.25}       # similar to the HCP 7T scan
n_b0: 3                     # b=0 volumes kept per simulated protocol (at most 18). Cached.

# ---- geometry (cached) ---------------------------------------------------------------
crop_margin_mm: 12          # margin (mm) of the box around the V1-V3 surface vertices
ref_voxel: 1.25             # HCP 3T native voxel size (mm); leave at 1.25
sh_order_out: 8             # fODF SH order, even; 8 gives 45 coefficients
sh_order_in: 4              # per-shell signal SH order of the network input, even; 4 gives 15 per shell
shells_in: [1000, 2000, 3000]   # shells the signal input holds (missing ones are zero)
                            # sh_order_out, sh_order_in and shells_in set the network size: retrain after a change

# ---- reference and classical models (cached) -----------------------------------------
ref_model: msmt_csd         # msmt_csd | csd  (csd = single-shell CSD on b=3000)
wm_mask_thr: 0.05           # fit fODFs where white-matter fraction exceeds this (0 to 1)
rumba_iters: 200            # RUMBA-SD iterations

# ---- tractography (particle filtering with the continuous map criterion) ------------
# The comparison tracker (method suffix +prob, plain probabilistic tracking) uses the same step, angle, lengths and seeds.
tracking:
  step_mm: 0.5              # step size (mm)
  max_angle: 20             # maximum turning angle per step (degrees)
  pmf_threshold: 0.7        # directions below this fraction of the voxel's largest fODF amplitude are never drawn
                            # (0 to 1; DIPY default 0.1); chosen on the development subjects
  seed_depth_mm: 1.0        # seeds sit this far below the white surface (mm)
  seed_jitter_mm: 0.3       # Gaussian jitter of seed positions (mm)
  max_len_mm: 120           # streamlines longer than this are stopped (mm)
  min_len_mm: 3             # shorter streamlines are discarded (mm)
  pft_back_mm: 2.0          # particle-filter back-tracking distance (mm)
  pft_front_mm: 1.0         # particle-filter front-tracking distance (mm)
  particles: 15             # particles per particle-filter step
  endpoint_tol_mm: 2.5      # maximum distance (mm) from a streamline end to its white-surface vertex

# ---- retinotopic reference (no cache clear needed) -----------------------------------
prf:
  r2_min: 10                # minimum pRF variance explained (%)
  ecc_min: 0.5              # degrees
  ecc_max: 7.0              # degrees; at most 8 (HCP stimulus radius)
  meridian_margin_deg: 0    # leave out vertices within this many degrees of a meridian (0 to 45; 0 = keep all)
  null_tol: 0.10            # surrogate endpoint distance within +-this fraction of the real one
  null_tol_min_mm: 1.0      # lower bound on that tolerance (mm)
  n_ecc_bins: 6             # eccentricity bins of the binned eccentricity-matrix score

# ---- network and loss (changes need retraining, not a cache clear) --------------------
model:
  levels: 3                 # U-Net resolution levels; patch must be a multiple of 2^(levels-1)
  lr: 2.0e-4                # AdamW learning rate (times the number of DDP processes), cosine decay
  weight_decay: 1.0e-4
  lambda_nonneg: 0.1        # weight of the negative-amplitude penalty
  lambda_path: 1.0          # weight of the path-consistency loss; 0 = voxel loss only
  path:
    seeds_per_patch: 64     # path seeds per training patch
    steps_start: 4          # curriculum: path length (steps) grows from steps_start
    steps_end: 40           # to steps_end over the first half of training
    step_mm: 0.625          # path step length (mm)
    cone_deg: 20            # directions within this angle (deg) of the previous one; equal to tracking.max_angle
    sharpen: 4.0            # exponent on normalised amplitudes; higher = closer to a hard arg-max
    one_step: false         # ablation: direction loss along reference paths, no accumulation
  seed_where: cortex        # cortex | wm (ablation: path seeds anywhere in white matter)
  use_anat: true            # anatomical input channels (the noanat ablation turns them off)
  kind: refine              # refine (CSD fODF + U-Net correction) | unet | mlp; the baselines set their own
  input: fodf               # fodf (CSD fODF of the degraded scan) | signal (per-shell signal SH); fodf for refine
  amp: true                 # mixed precision (CUDA only)
  compile: false            # torch.compile the network before training
  ckpt_minutes: 15          # checkpoint interval during training (minutes)

# ---- NSD external test (real 3T scans; stimulus radius 4.2 degrees; dense native surfaces) ----
nsd:
  ecc_max: 4.2              # NSD stimulus radius (degrees); do not raise
  seeds_per_vertex: 1       # NSD meshes are denser (about 10,000 V1-V3 vertices per hemisphere)
  use_run2: true            # also process the second diffusion run (run-to-run reproducibility)
  flip_x: true              # flip the b-vector x sign, required for the NSD files. Cached.

# ---- statistics (no cache clear needed) -------------------------------------------------
stats:
  alpha: 0.05               # significance level
  n_boot: 10000             # bootstrap resamples for confidence intervals
  acc_margin: 0.02          # non-inferiority margin for voxel accuracy (angular correlation) in H3
  rsi_margin: 0.05          # non-inferiority margin for RSI of the path network against classical CSD

# ---- training-size analysis (docs/04-configuration.md) ----------------------------------
# Output folders of the same experiment run with other n_train. Notebooks 09 and 10 read the folders that exist.
training_size_runs: {35: outputs_train35, 100: outputs_train100}

# ---- cluster (optional) -----------------------------------------------------------------
multi_gpu: jobs             # several GPUs: jobs = one training run per GPU | ddp = every run uses all GPUs
nodes: []                   # SSH host names; empty = this machine only (passwordless SSH, same project path)
